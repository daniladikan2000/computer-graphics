<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Color Studio | Lab 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #3f3f46;
            border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #a1a1aa;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            transition: background 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            background: #d4d4d8;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-8 max-w-4xl w-full">
        <h1 class="text-2xl font-medium mb-10 text-center tracking-wide text-zinc-100">
            Интерактивные цветовые модели
        </h1>

        <!-- Верхняя панель -->
        <div class="flex flex-col md:flex-row items-stretch gap-8 mb-12">
            <!-- Квадрат с цветом -->
            <div id="preview" class="w-full md:w-1/2 min-h-[140px] rounded-xl border border-zinc-700 shadow-inner transition-colors duration-75"></div>
            
            <!-- Инпуты -->
            <div class="flex-1 flex flex-col sm:flex-row items-center justify-center gap-8">
                <!-- Палитра -->
                <div class="flex flex-col items-center justify-center w-full sm:w-1/2">
                    <span class="text-xs text-zinc-500 uppercase tracking-widest mb-3 font-medium">Палитра</span>
                    <div class="relative w-16 h-16 rounded-full overflow-hidden border border-zinc-600 hover:border-zinc-400 transition-colors shadow-inner bg-zinc-800">
                        <input type="color" id="picker" value="#6C9676" class="absolute -top-2 -left-2 w-24 h-24 cursor-pointer bg-transparent border-0">
                    </div>
                </div>

                <!-- HEX -->
                <div class="flex flex-col items-center justify-center w-full sm:w-1/2">
                    <span class="text-xs text-zinc-500 uppercase tracking-widest mb-3 font-medium">HEX</span>
                    <input type="text" id="hex-input" value="#6C9676" maxlength="7" 
                           class="bg-transparent border-b-2 border-zinc-700 px-2 py-1 w-28 text-center font-mono text-xl text-zinc-200 focus:outline-none focus:border-zinc-500 transition-colors">
                </div>
            </div>
        </div>

        <!-- Сетка моделей -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <!-- RGB -->
            <div class="flex flex-col h-full">
                <h2 class="text-sm font-semibold text-zinc-500 uppercase tracking-widest mb-6">RGB</h2>
                <div id="rgb-controls" class="flex flex-col justify-between flex-grow gap-5"></div>
            </div>

            <!-- CMYK -->
            <div class="flex flex-col h-full">
                <h2 class="text-sm font-semibold text-zinc-500 uppercase tracking-widest mb-6">CMYK</h2>
                <div id="cmyk-controls" class="flex flex-col justify-between flex-grow gap-5"></div>
            </div>

            <!-- HSV -->
            <div class="flex flex-col h-full">
                <h2 class="text-sm font-semibold text-zinc-500 uppercase tracking-widest mb-6">HSV</h2>
                <div id="hsv-controls" class="flex flex-col justify-between flex-grow gap-5"></div>
            </div>
        </div>
    </div>

<script>
    const config = {
        rgb: [{id:'r', max:255}, {id:'g', max:255}, {id:'b', max:255}],
        cmyk: [{id:'c', max:100}, {id:'m', max:100}, {id:'y', max:100}, {id:'k', max:100}],
        hsv: [{id:'h', max:360}, {id:'s', max:100}, {id:'v', max:100}]
    };

    // Генерация HTML
    for (const [model, items] of Object.entries(config)) {
        const container = document.getElementById(`${model}-controls`);
        items.forEach(item => {
            container.innerHTML += `
                <div class="grid grid-cols-[15px_1fr_45px] gap-4 items-center">
                    <label class="text-right font-medium text-zinc-400 uppercase text-xs">${item.id}</label>
                    
                    <input type="range" id="${item.id}-sl" min="0" max="${item.max}" 
                           oninput="sync('${model}', '${item.id}', this.value)">
                    
                    <input type="number" id="${item.id}-num" min="0" max="${item.max}" 
                           class="w-full bg-transparent border-b border-zinc-700 text-zinc-300 px-1 py-1 text-center text-sm font-mono focus:outline-none focus:border-zinc-400 transition-colors" 
                           oninput="sync('${model}', '${item.id}', this.value)">
                </div>`;
        });
    }

    async function sendToPython(source, values) {
        const response = await fetch('/api/convert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source, values })
        });
        if (response.ok) {
            const data = await response.json();
            updateUI(source, data);
        }
    }

    function sync(model, channel, val) {
        const max = config[model].find(i => i.id === channel).max;
        
        let numVal = parseInt(val, 10);
        
        if (isNaN(numVal) || numVal < 0) {
            numVal = 0;
        } else if (numVal > max) {
            numVal = max;
        }

        document.getElementById(`${channel}-sl`).value = numVal;
        
        if (val !== '') {
            document.getElementById(`${channel}-num`).value = numVal;
        }
        
        const values = {};
        config[model].forEach(item => {
            const rawVal = document.getElementById(`${item.id}-num`).value;
            values[item.id] = rawVal === '' ? 0 : parseInt(rawVal, 10);
        });
        sendToPython(model, values);
    }

    function updateUI(source, data) {
        document.getElementById('preview').style.backgroundColor = data.hex;
        if (source !== 'hex') {
            document.getElementById('picker').value = data.hex;
            document.getElementById('hex-input').value = data.hex;
        }
        for (const [model, items] of Object.entries(config)) {
            if (source !== model) {
                items.forEach(item => {
                    document.getElementById(`${item.id}-sl`).value = data[model][item.id];
                    document.getElementById(`${item.id}-num`).value = data[model][item.id];
                });
            }
        }
    }

    document.getElementById('picker').addEventListener('input', (e) => {
        document.getElementById('hex-input').value = e.target.value.toUpperCase();
        sendToPython('hex', { hex: e.target.value });
    });
    
    document.getElementById('hex-input').addEventListener('change', (e) => {
        let val = e.target.value;
        if (!val.startsWith('#')) val = '#' + val;
        if (/^#[0-9A-F]{6}$/i.test(val)) {
            document.getElementById('picker').value = val;
            e.target.value = val.toUpperCase();
            sendToPython('hex', { hex: val });
        }
    });

    sendToPython('hex', { hex: '#6C9676' });
</script>
</body>
</html>
